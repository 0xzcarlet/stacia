services:
  bot:
    build: .
    image: stacia:local
    init: true
    restart: unless-stopped
    mem_limit: 300m
    cpus: 1.0
    stop_grace_period: 20s
    volumes:
      - bot-data:/data
      - ./config.docker.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'const fs=require("fs");const h=JSON.parse(fs.readFileSync("/data/session/health.json"));process.exit(h.connected && Date.now()-h.timestamp<20000?0:1)',
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
volumes:
  bot-data:
